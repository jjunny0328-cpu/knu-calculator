    };
  </script>

  <!-- ======================================================================
       3. app: 저장소, 상태 변경 함수, 라우터, 화면
       상태 변경은 "상태 변경 함수" 구역의 함수로만 한다. 화면은 state만 보고 다시 그린다.
       HTML 문자열을 만들지 않고 h()로 요소를 직접 만들어 사용자 데이터가 코드로 해석될 경로를 없앴다.
       ====================================================================== -->
  <script id="app-script">
    'use strict';

    /* ---------- 실행 환경 ----------
       같은 파일이 세 곳에서 열린다. 1) GitHub Pages 같은 웹 주소(https)  2) 내려받은 파일(file://)  3) claude.ai 아티팩트 뷰어.
       아이폰은 파일 앱에서 HTML을 열면 스크립트를 실행하지 않으므로, 아이폰 사용자는 사실상 1)로만 쓴다.
       환경 판별은 여기서 한 번만 하고, 화면 코드는 아래 상수만 본다(판별 규칙이 화면 곳곳에 흩어지지 않게). */
    const HAS_HOST = Boolean(window.claude && typeof window.claude.use === 'function');
    const IS_WEB = location.protocol === 'https:' || location.protocol === 'http:';
    const UA = navigator.userAgent || '';
    // iPadOS 13부터 아이패드 Safari는 자신을 Mac이라고 소개하므로 터치 지점 수로 한 번 더 가린다
    const IS_IOS = /iPhone|iPad|iPod/.test(UA) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    const IS_ANDROID = /Android/i.test(UA);
    // 홈 화면 앱으로 실행 중인지. 아이폰은 navigator.standalone, 그 밖에는 표준 display-mode 미디어 쿼리로 알 수 있다
    const IS_STANDALONE = navigator.standalone === true ||
      (typeof window.matchMedia === 'function' && window.matchMedia('(display-mode: standalone)').matches);
    const IS_KAKAOTALK = /KAKAOTALK/i.test(UA);
    // 아이폰의 Safari, Chrome, Firefox, Edge는 모두 사용자 에이전트에 'Safari/' 표시를 남긴다. 이 표시가 없으면
    // 카카오톡, 에브리타임, 인스타그램처럼 앱 안에 띄운 브라우저로 본다(홈 화면 앱도 표시가 없어서 따로 뺀다). 추정 규칙이다.
    const IS_IOS_INAPP = IS_IOS && !IS_STANDALONE && !/Safari\//.test(UA);
    const IS_IOS_CHROME = IS_IOS && /CriOS\//.test(UA);

    /* 웹 주소로 열었을 때만 홈 화면 아이콘과 앱 설명 파일(manifest)을 연결한다.
       파일로 열거나 아티팩트 안에서 열면 이 파일들이 옆에 없어서, 연결하면 불필요한 오류만 남는다. */
    (function linkHomeScreenFiles() {
      if (!IS_WEB || HAS_HOST) return;
      const links = [
        { rel: 'manifest', href: 'manifest.webmanifest' },
        { rel: 'apple-touch-icon', href: 'apple-touch-icon.png' },
        { rel: 'icon', href: 'icon-192.png', type: 'image/png' }
      ];
      for (const attrs of links) {
        if (document.head.querySelector(`link[rel="${attrs.rel}"]`)) continue;
        const link = document.createElement('link');
        for (const [k, v] of Object.entries(attrs)) link.setAttribute(k, v);
        document.head.append(link);
      }
    })();

    /* 저장 공간을 '지속' 모드로 요청한다. 허락되면 저장 공간이 부족해도 브라우저가 이 기록을 먼저 지우지 않는다.
       WebKit은 홈 화면 앱일 때 허락하는 경향이 있다. 결과와 상관없이 앱은 그대로 동작한다.
       데스크톱 Firefox는 이 요청에 권한 창을 띄우므로 아이폰과 홈 화면 앱에서만 부른다. */
    function requestPersistence() {
      try {
        const sm = navigator.storage;
        if (!sm || typeof sm.persist !== 'function') return;
        Promise.resolve(typeof sm.persisted === 'function' ? sm.persisted() : false)
          .then(already => already || sm.persist())
          .catch(() => { /* 지원하지 않거나 거절되면 넘어간다 */ });
      } catch (err) { /* 위와 같다 */ }
    }

    /* ---------- 요소 만들기 ---------- */
    function h(tag, props, ...children) {
      const el = document.createElement(tag);
      if (props) {
        for (const [k, v] of Object.entries(props)) {
          if (v === null || v === undefined || v === false) continue;
          if (k === 'class') el.className = v;
          else if (k === 'style' && typeof v === 'object') Object.assign(el.style, v);
          else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2).toLowerCase(), v);
          else if (v === true) el.setAttribute(k, '');
          else el.setAttribute(k, String(v));
        }
      }
      for (const c of children.flat(Infinity)) {
        if (c === null || c === undefined || c === false) continue;
        el.append(c instanceof Node ? c : document.createTextNode(String(c)));
      }
      return el;
    }
    const ICON_PATHS = { back: 'M15 5l-7 7 7 7', check: 'M5 12.5l4.5 4.5L19 7.5' };
    function icon(name) {
      const ns = 'http://www.w3.org/2000/svg';
      const svg = document.createElementNS(ns, 'svg');
      for (const [k, v] of Object.entries({ viewBox: '0 0 24 24', class: 'icon', 'aria-hidden': 'true', focusable: 'false' })) svg.setAttribute(k, v);
      const path = document.createElementNS(ns, 'path');
      for (const [k, v] of Object.entries({ d: ICON_PATHS[name], fill: 'none', stroke: 'currentColor', 'stroke-width': '2', 'stroke-linecap': 'round', 'stroke-linejoin': 'round' })) path.setAttribute(k, v);
      svg.append(path);
      return svg;
    }
    const fmtGpa = v => v === null ? null : v.toFixed(3);
    const catLabel = c => c === 'major' ? COPY.common.major : COPY.common.ge;

    /* ---------- 저장소 ---------- */
    let state = newState();
    let storageOK = true;
    let startupNotice = null; // 이전 기록을 가져오지 못했을 때 첫 화면에 한 번 보여 줄 안내

    /* 시작할 때 기록 읽기. 어떤 경우에도 예외를 밖으로 내보내지 않는다.
       1) V4 키가 있으면 그것만 쓴다. 읽지 못하면 원문을 따로 옮겨 두고 빈 상태로 시작한다.
       2) V4 키가 없을 때만 가장 최근 이전 버전의 키 하나를 읽어 본다. 형식이 맞으면 가져오고,
          맞지 않으면(다른 학번 과목이 섞였거나 구조가 깨짐) 빈 상태로 시작한다. 이전 키는 지우지 않는다. */
    function loadState() {
      try {
        void localStorage.length; // 저장소 자체를 쓸 수 없는 환경(사생활 보호 모드 등)을 먼저 가린다
      } catch (err) {
        console.warn('localStorage 접근 불가:', err);
        return { state: null, source: 'none', storageError: true };
      }
      const read = key => {
        let raw = null;
        try { raw = localStorage.getItem(key); } catch (err) { return { present: false }; }
        if (raw === null || raw === '') return { present: false };
        let parsed;
        try { parsed = JSON.parse(raw); } catch (err) { return { present: true, ok: false, raw, error: 'json' }; }
        const r = migrate(parsed);
        return { present: true, ok: r.ok, state: r.state, raw, error: r.error };
      };
      const v4 = read(STORAGE_KEY_V4);
      if (v4.present) {
        if (v4.ok && v4.state) return { state: v4.state, source: 'v4' };
        console.warn('V4 기록을 읽지 못함:', v4.error);
        try { localStorage.setItem(STORAGE_KEY_V4 + '_unreadable', v4.raw); } catch (err) { /* 옮겨 두지 못해도 진행 */ }
        return { state: null, source: 'none', notice: 'storedUnreadable' };
      }
      for (const key of LEGACY_STORAGE_KEYS) {
        const r = read(key);
        if (!r.present) continue;
        if (r.ok && r.state) return { state: r.state, source: 'legacy' };
        console.warn('이전 기록을 가져오지 않음:', key, r.error);
        return { state: null, source: 'none', notice: 'legacySkipped' };
      }
      return { state: null, source: 'none' };
    }
    function save() {
      try {
        localStorage.setItem(STORAGE_KEY_V4, JSON.stringify(state));
        storageOK = true;
      } catch (err) {
        console.warn('저장 실패:', err);
        storageOK = false;
      }
    }

    /* 흐름 진행 정보는 탭 단위(sessionStorage)로 둔다. 쓸 수 없으면 메모리로 대신한다. */
    const memorySession = {};
    const session = {
      get(key) {
        try { const v = sessionStorage.getItem(key); return v === null ? null : JSON.parse(v); }
        catch { return key in memorySession ? memorySession[key] : null; }
      },
      set(key, value) {
        try { sessionStorage.setItem(key, JSON.stringify(value)); }
        catch { memorySession[key] = value; }
      }
    };
    const addedKey = semId => `flow:added:${semId}`;
    const queueKey = semId => `flow:queue:${semId}`;
    const answeredKey = semId => `flow:answered:${semId}`;
    function sessionAdded(semId) { return new Set(session.get(addedKey(semId)) || []); }
    function markAdded(semId, id) { const s = sessionAdded(semId); s.add(id); session.set(addedKey(semId), [...s]); }
    function unmarkAdded(semId, id) { const s = sessionAdded(semId); s.delete(id); session.set(addedKey(semId), [...s]); }
    /* 저장값 null은 "아직 묻지 않음"과 "아직 안 나왔다고 답함"을 구분하지 못한다.
       이번 흐름에서 실제로 답한 과목만 기록해 두고, 그 경우에만 "아직 안 나왔어요"를 선택된 것으로 보여 준다. */
    function sessionAnswered(semId) { return new Set(session.get(answeredKey(semId)) || []); }
    function markAnswered(semId, id) { const s = sessionAnswered(semId); s.add(id); session.set(answeredKey(semId), [...s]); }
    function resetFlow(semId) { session.set(addedKey(semId), []); session.set(queueKey(semId), null); session.set(answeredKey(semId), []); }
    function getQueue(semId) { return session.get(queueKey(semId)) || []; }

    /* ---------- 인덱스 캐시 ---------- */
    const indexCache = {};
    const getIndex = year => indexCache[year] || (indexCache[year] = buildIndex(CURRICULUM_DATA[year]));

    /* ---------- 상태 변경 함수(상태는 여기서만 바꾼다) ---------- */
    const countCourses = () => SEMESTERS.reduce((n, s) => n + state.semesters[s.id].length, 0);
    const findCourse = (semId, id) => state.semesters[semId].find(c => c.id === id);

    function setYear(year) { state.studentYear = year; save(); }
    function addOfficial(semId, item) {
      const course = { id: newId(), name: item.name, credits: item.credits, category: categoryOfType(item.type, state.studentYear),
                       sourceType: item.type, grade: null, isCustom: false };
      state.semesters[semId].push(course);
      markAdded(semId, course.id);
      save();
      return course;
    }
    function addCustom(semId, name) {
      // v2의 직접 입력 기본값(3학점, 교양)을 그대로 쓰고, 다음 질문에서 확인받는다
      const course = { id: newId(), name: name.slice(0, 40), credits: 3, category: 'ge', sourceType: null, grade: null, isCustom: true };
      state.semesters[semId].push(course);
      markAdded(semId, course.id);
      save();
      return course;
    }
    function updateCourse(semId, id, patch) {
      const c = findCourse(semId, id);
      if (!c) return;
      Object.assign(c, patch);
      save();
    }
    function removeCourse(semId, id) {
      const list = state.semesters[semId];
      const index = list.findIndex(c => c.id === id);
      if (index < 0) return;
      const [removed] = list.splice(index, 1);
      const wasNew = sessionAdded(semId).has(id) && removed.grade === null;
      unmarkAdded(semId, id);
      save();
      // 이번에 막 고른 과목을 다시 누른 것은 선택 해제일 뿐이라 알리지 않는다. 기존 기록을 지운 경우만 되돌리기를 준다.
      if (!wasNew) {
        toast(COPY.common.deleted(removed.name), {
          label: COPY.common.undo,
          onClick: () => {
            const target = state.semesters[semId];
            target.splice(Math.min(index, target.length), 0, removed);
            save();
            render();
          }
        });
      }
    }
    function resetAll() { state.semesters = emptySemesters(); save(); }
    function replaceState(next) { state = next; save(); }

    /* ---------- 라우터(해시) ----------
       #/start, #/home, #/settings, #/settings/year,
       #/sem/{학기}/pick, #/sem/{학기}/custom/{id}/credits|category, #/sem/{학기}/grade/{id}, #/sem/{학기}/review */
    const app = document.getElementById('app');

    function parseHash() {
      const raw = location.hash.replace(/^#/, '');
      const [path, query] = raw.split('?');
      return { parts: path.split('/').filter(Boolean).map(decodeURIComponent), params: new URLSearchParams(query || '') };
    }
    function go(route) {
      if (location.hash === '#' + route) render();
      else location.hash = route;
    }
    function replace(route) {
      if (location.hash === '#' + route) render();
      else location.replace('#' + route);
    }
    const semRoute = (semId, ...rest) => ['/sem', semId, ...rest].join('/');
    const firstEmptySemester = () => (SEMESTERS.find(s => state.semesters[s.id].length === 0) || {}).id || null;

    function startSemester(semId) { resetFlow(semId); go(semRoute(semId, 'pick')); }

    /* 흐름 순서 계산: 이번에 고른 과목 중 직접 입력한 과목은 학점과 구분을 먼저 묻고, 그다음 성적을 묻는다 */
    function buildQueue(semId) {
      const added = sessionAdded(semId);
      const list = state.semesters[semId].filter(c => added.has(c.id));
      return [
        ...list.filter(c => c.isCustom).flatMap(c => [semRoute(semId, 'custom', c.id, 'credits'), semRoute(semId, 'custom', c.id, 'category')]),
        ...list.map(c => semRoute(semId, 'grade', c.id))
      ];
    }
    function nextRoute(semId, current) {
      const q = getQueue(semId);
      const i = q.indexOf(current);
      return (i >= 0 && q[i + 1]) || semRoute(semId, 'review');
    }
    function advance(semId, current) { go(nextRoute(semId, current)); }

    function resolveRoute(parts, params) {
      const [a, b, c, d, e] = parts;
      if (!a) { replace(state.studentYear ? '/home' : '/start'); return null; }
      if (a === 'start') return YearScreen('onboard');
      if (!state.studentYear) { replace('/start'); return null; }
      if (a === 'home') return HomeScreen();
      if (a === 'settings') return b === 'year' ? YearScreen('settings') : SettingsScreen();
      if (a === 'sem' && SEM_BY_ID[b]) {
        if (c === 'pick') return PickScreen(b);
        if (c === 'review') return ReviewScreen(b);
        const current = '/' + parts.join('/');
        const course = findCourse(b, d);
        if (c === 'grade' && course) return GradeScreen(b, course, params.get('back') === 'review');
        if (c === 'custom' && course && course.isCustom && e === 'credits') return CreditsScreen(b, course);
        if (c === 'custom' && course && course.isCustom && e === 'category') return CategoryScreen(b, course);
        if (c === 'grade' || c === 'custom') { replace(nextRoute(b, current)); return null; } // 도중에 삭제된 과목은 건너뛴다
      }
      replace('/home');
      return null;
    }

    function render() {
      const { parts, params } = parseHash();
      let view = null;
      try {
        view = resolveRoute(parts, params);
      } catch (err) {
        console.error(err);
        replace('/home');
        return;
      }
      if (!view) return;
      if (startupNotice) {
        const main = view.el.querySelector('main');
        if (main) main.prepend(h('p', { class: 'banner', role: 'status' }, startupNotice));
        startupNotice = null;
      }
      app.replaceChildren(view.el);
      document.title = COPY.docTitle(view.title);
      window.scrollTo(0, 0);
      const heading = app.querySelector('h1');
      if (heading) heading.focus({ preventScroll: true });
    }

    /* ---------- 공통 화면 요소 ---------- */
    function Screen({ back = false, topLabel = '', topRight = null, progress = null, body, footer = null, homeBar = false }) {
      const top = homeBar
        ? h('header', { class: 'topbar' }, h('span', { class: 'topbar-title' }, COPY.appName), topRight)
        : h('header', { class: 'topbar' },
            back ? h('button', { type: 'button', class: 'icon-btn', 'aria-label': COPY.common.back, onClick: () => history.back() }, icon('back'))
                 : null,
            h('span', { class: back ? 'topbar-label' : 'topbar-label is-root' }, topLabel),
            topRight || h('span', { class: 'topbar-spacer' }),
            progress === null ? null : h('div', { class: 'step-progress', 'aria-hidden': 'true' },
              h('div', { class: 'step-progress-fill', style: { width: `${Math.round(progress * 100)}%` } })));
      return h('div', { class: 'screen' }, top, h('main', { class: 'content' }, body), footer ? h('div', { class: 'footer' }, footer) : null);
    }
    function Question(title, help) {
      return [
        h('h1', { class: 'q-title', id: 'q-title', tabindex: '-1' }, title),
        help ? h('p', { class: 'q-help', id: 'q-help' }, help) : null
      ];
    }
    function homeLink() {
      return h('button', { type: 'button', class: 'link-btn', onClick: () => go('/home') }, COPY.common.homeShort);
    }
    /* 선택지 묶음: 방향키로 버튼 사이를 이동한다(선택은 Enter나 Space로). */
    function Choices(cls, buttons) {
      return h('div', {
        class: `choices ${cls}`, role: 'group', 'aria-labelledby': 'q-title',
        onKeydown: e => {
          const keys = { ArrowRight: 1, ArrowLeft: -1, ArrowDown: 'down', ArrowUp: 'up' };
          if (!(e.key in keys)) return;
          const btns = [...e.currentTarget.querySelectorAll('button')];
          const i = btns.indexOf(document.activeElement);
          if (i < 0) return;
          e.preventDefault();
          const cols = getComputedStyle(e.currentTarget).gridTemplateColumns.split(' ').length;
          let step = keys[e.key];
          if (step === 'down') step = cols;
          if (step === 'up') step = -cols;
          btns[Math.max(0, Math.min(btns.length - 1, i + step))].focus();
        }
      }, buttons);
    }
    function choice(label, current, onClick, extraClass = '', meta = null) {
      return h('button', { type: 'button', class: `choice ${extraClass}`.trim(), 'aria-current': current ? 'true' : null, onClick },
        h('span', null, label), meta ? h('span', { class: 'choice-meta' }, meta) : null);
    }
    function flowProgress(semId, route) {
      const q = getQueue(semId);
      const i = q.indexOf(route);
      return i < 0 ? null : (i + 1) / (q.length + 1);
    }

    /* ---------- 토스트, 대화상자 ---------- */
    let toastTimer = null;
    function toast(message, action = null) {
      const region = document.getElementById('toast-region');
      clearTimeout(toastTimer);
      region.replaceChildren(h('div', { class: 'toast' },
        h('span', null, message),
        action ? h('button', { type: 'button', class: 'toast-action', onClick: () => { hideToast(); action.onClick(); } }, action.label) : null));
      toastTimer = setTimeout(hideToast, action ? 5000 : 3000);
    }
    function hideToast() { document.getElementById('toast-region').replaceChildren(); }

    /* 확인 대화상자. title(+body) 형태와, 긴 문장 하나를 그대로 보여 주는 message 형태를 지원한다. */
    function confirmDialog({ title, body, message, confirm, danger = false }) {
      const dlg = document.getElementById('dialog');
      if (typeof dlg.showModal !== 'function') return Promise.resolve(window.confirm(message || `${title}\n${body || ''}`));
      return new Promise(resolve => {
        if (body) dlg.setAttribute('aria-describedby', 'dialog-body');
        else dlg.removeAttribute('aria-describedby');
        dlg.replaceChildren(h('form', { method: 'dialog' },
          message ? h('p', { class: 'dialog-message', id: 'dialog-title' }, message)
                  : h('h2', { class: 'dialog-title', id: 'dialog-title' }, title),
          body ? h('p', { class: 'dialog-body', id: 'dialog-body' }, body) : null,
          h('div', { class: 'dialog-actions' },
            h('button', { value: 'cancel', class: 'btn btn-secondary', autofocus: true }, COPY.common.close),
            h('button', { value: 'confirm', class: danger ? 'btn btn-danger' : 'btn btn-primary' }, confirm))));
        dlg.returnValue = '';
        dlg.addEventListener('close', () => resolve(dlg.returnValue === 'confirm'), { once: true });
        dlg.showModal();
      });
    }

    /* ---------- 안내 카드(v4.1) ----------
       어떤 안내를 보여 줄지는 currentTip() 한 곳에서 정한다. 앱 안 브라우저 안내가 홈 화면 추가 안내보다 먼저다:
       앱 안 브라우저에서는 홈 화면에 추가할 수 없어서, 먼저 Safari로 나가야 다음 안내가 의미가 있다.
       닫았다는 표시는 과목 기록과 다른 키에 둔다. 저장하지 못하는 환경이면 이번 방문 동안만 숨긴다. */
    const TIP_KEY = 'knu_mech_curriculum_tips_v1';
    const memoryTips = {};
    function readTips() {
      try {
        const v = JSON.parse(localStorage.getItem(TIP_KEY) || '{}');
        return v && typeof v === 'object' && !Array.isArray(v) ? v : {};
      } catch { return {}; }
    }
    const tipDismissed = name => Boolean(memoryTips[name] || readTips()[name] === true);
    function dismissTip(name) {
      memoryTips[name] = true;
      try { localStorage.setItem(TIP_KEY, JSON.stringify({ ...readTips(), [name]: true })); }
      catch (err) { /* 위 설명처럼 이번 방문 동안만 숨긴다 */ }
    }
    function currentTip() {
      if (!IS_WEB || HAS_HOST) return null;
      if (IS_KAKAOTALK || IS_IOS_INAPP) return tipDismissed('inapp') ? null : 'inapp';
      if (IS_IOS && !IS_STANDALONE) return tipDismissed('ios') ? null : 'ios';
      return null;
    }
    function TipCard(name) {
      const c = COPY.tip[name];
      const n = countCourses();
      const titleId = `tip-${name}-title`;
      const title = name === 'inapp' ? c.title(IS_ANDROID) : c.title;
      const steps = name === 'inapp' ? c.steps(IS_KAKAOTALK, IS_ANDROID) : c.steps(IS_IOS_CHROME);
      const card = h('section', { class: 'tip', 'aria-labelledby': titleId, 'data-tip': name },
        h('h2', { class: 'tip-title', id: titleId }, title),
        h('p', { class: 'tip-body' }, c.body),
        h('ol', { class: 'tip-steps' }, steps.map(s => h('li', null, s))),
        n > 0 ? h('p', { class: 'tip-warn' }, c.backupFirst(n)) : null,
        h('div', { class: 'tip-actions' },
          h('button', { type: 'button', class: 'btn btn-text', onClick: () => {
            dismissTip(name);
            card.remove();
            const heading = app.querySelector('h1'); // 누른 버튼이 사라지므로 초점을 화면 제목으로 옮긴다
            if (heading) heading.focus({ preventScroll: true });
          } }, COPY.tip.dismiss)));
      return card;
    }
    function tipSlot() {
      const name = currentTip();
      return name ? TipCard(name) : null;
    }

    /* ---------- 화면: 학번 ---------- */
    function YearScreen(mode) {
      const onboard = mode === 'onboard';
      const cur = state.studentYear;
      const buttons = YEAR_IDS.map(id => choice(YEAR_CONFIG[id].label, cur === id, () => chooseYear(id, mode), 'choice-row',
        cur === id ? COPY.year.current : null));
      return {
        title: onboard ? null : COPY.year.changeTitle,
        el: Screen({
          back: !onboard,
          topLabel: onboard ? COPY.appFull : COPY.settings.title,
          body: [
            ...Question(onboard ? COPY.year.title : COPY.year.changeTitle,
                        onboard ? COPY.year.help : COPY.year.changeHelp(YEAR_CONFIG[cur].label, countCourses())),
            Choices('choices-col', buttons),
            onboard ? tipSlot() : null // 과목을 입력하기 전에 알려야 기록을 옮길 일이 없다
          ]
        })
      };
    }
    /* V4: 학번은 서로 독립이다. 학번이 바뀌면 이전 학번 기준으로 입력한 과목을 하나도 남기지 않는다.
       입력한 과목이 있으면 먼저 확인을 받고, 수락하면 resetAll()로 state.semesters를 모두 빈 배열로 만든 뒤 학번을 바꾼다.
       설정에서 바꿀 때와 첫 흐름에서 뒤로 돌아가 다시 고를 때 모두 이 함수 하나를 지난다. */
    async function chooseYear(id, mode) {
      const label = YEAR_CONFIG[id].label;
      const prev = state.studentYear;
      const changed = Boolean(prev) && prev !== id;
      const had = countCourses();
      if (changed && had > 0) {
        const ok = await confirmDialog({ message: COPY.year.resetConfirm, confirm: COPY.year.confirmAction, danger: true });
        if (!ok) return; // 닫기를 누르면 학번도 기록도 그대로 둔다
      }
      if (changed) {
        resetAll();                              // state.semesters의 8개 학기를 모두 빈 배열로 초기화하고 저장
        SEMESTERS.forEach(s => resetFlow(s.id)); // 진행 중이던 입력 흐름 정보도 비운다
      }
      setYear(id);
      if (mode === 'settings') {
        if (changed) toast(had > 0 ? COPY.year.changedReset(label) : COPY.year.changed(label));
        history.back();
        return;
      }
      const first = firstEmptySemester();
      if (first) startSemester(first);
      else go('/home');
    }

    /* ---------- 화면: 과목 고르기(추천 입력 컴포넌트) ---------- */
    function PickScreen(semId) {
      const sem = SEM_BY_ID[semId];
      const year = state.studentYear;
      const search = createCourseSearch({
        semId,
        index: getIndex(year),
        guide: COPY.guide[year],
        onChange: updateFooter
      });
      const note = h('p', { class: 'footer-note', 'aria-live': 'polite' });
      const error = h('p', { class: 'field-error', role: 'alert' });
      const skip = h('button', { type: 'button', class: 'btn btn-text', onClick: () => go(semRoute(semId, 'review')) }, COPY.pick.skip);
      function updateFooter() {
        const n = state.semesters[semId].length;
        note.textContent = n ? COPY.pick.count(n) : '';
        note.hidden = !n;
        skip.hidden = n > 0;
        if (n) error.textContent = '';
      }
      function onNext() {
        if (!state.semesters[semId].length) { error.textContent = COPY.pick.needOne; return; }
        const queue = buildQueue(semId);
        session.set(queueKey(semId), queue);
        go(queue[0] || semRoute(semId, 'review'));
      }
      updateFooter();
      return {
        title: sem.label,
        el: Screen({
          back: true, topLabel: sem.label, topRight: homeLink(),
          body: [...Question(COPY.pick.title(sem.label), COPY.pick.help), search.el],
          footer: [error, note, h('div', { class: 'footer-row' }, skip),
                   h('button', { type: 'button', class: 'btn btn-primary', onClick: onNext }, COPY.common.next)]
        })
      };
    }

    /* 추천 입력 컴포넌트. 화면, 키보드, ARIA만 담당하고 순위 계산은 match()에 맡긴다.
       목록은 팝업으로 띄우지 않고 화면에 펼쳐 둔다(한 화면 한 질문이라 공간을 통째로 쓸 수 있다). */
    function createCourseSearch({ semId, index, guide, onChange }) {
      const poolNames = new Set(index.map(e => e.item.name));
      let query = '';
      let options = [];
      let activeIndex = -1;
      let lastPointer = null;
      let seq = 0;
      let announceTimer = null;

      const input = h('input', {
        id: 'cs-input', class: 'search-input', type: 'text', role: 'combobox',
        'aria-labelledby': 'q-title', 'aria-describedby': 'q-help', 'aria-controls': 'cs-list',
        'aria-expanded': 'true', 'aria-autocomplete': 'list',
        autocomplete: 'off', autocapitalize: 'off', autocorrect: 'off', spellcheck: 'false',
        enterkeyhint: 'done', maxlength: '40', placeholder: COPY.pick.placeholder
      });
      const status = h('div', { class: 'sr-only', role: 'status', 'aria-live': 'polite' });
      const listbox = h('div', { id: 'cs-list', role: 'listbox', class: 'listbox', 'aria-multiselectable': 'true', 'aria-labelledby': 'q-title' });
      const guideEl = h('p', { class: 'list-guide' }, guide);

      const semCourses = () => state.semesters[semId];
      function enteredElsewhere() {
        const m = new Map();
        for (const s of SEMESTERS) if (s.id !== semId) for (const c of state.semesters[s.id]) if (!c.isCustom) m.set(c.name, s.id);
        return m;
      }
      function toOption(item, selectedNames, elsewhere) {
        const selected = selectedNames.has(item.name);
        const where = elsewhere.get(item.name);
        return {
          kind: 'course', item, label: item.name, credits: item.credits, selected,
          disabled: !selected && Boolean(where),
          meta: where && !selected ? COPY.pick.enteredIn(SEM_BY_ID[where].label) : (item.sem !== semId ? SEM_BY_ID[item.sem].label : null)
        };
      }
      function buildGroups() {
        const selectedNames = new Set(semCourses().filter(c => !c.isCustom).map(c => c.name));
        const elsewhere = enteredElsewhere();
        if (query.trim()) {
          const results = match(query, index, { sem: semId }).map(r => toOption(r.item, selectedNames, elsewhere));
          results.sort((a, b) => Number(a.disabled) - Number(b.disabled)); // 이미 다른 학기에 입력한 과목은 아래로
          const name = query.trim();
          return { found: results.length, groups: [{ label: null, opts: [...results, { kind: 'create', label: COPY.pick.create(name), name }] }] };
        }
        const outside = semCourses().filter(c => c.isCustom || !poolNames.has(c.name))
          .map(c => ({ kind: 'existing', course: c, label: c.name, credits: c.credits, selected: true, meta: c.isCustom ? COPY.common.custom : c.sourceType }));
        const recommended = index.filter(e => e.item.sem === semId).map(e => toOption(e.item, selectedNames, elsewhere));
        const others = index.filter(e => e.item.sem !== semId)
          .sort((a, b) => SEM_BY_ID[a.item.sem].order - SEM_BY_ID[b.item.sem].order)
          .map(e => toOption(e.item, selectedNames, elsewhere));
        return { found: null, groups: [
          { label: COPY.pick.groupOutside, opts: outside },
          { label: COPY.pick.groupRecommended(SEM_BY_ID[semId].label), opts: recommended },
          { label: COPY.pick.groupOther, opts: others }
        ] };
      }
      function optionEl(o) {
        o.id = `cs-o${(seq += 1)}`;
        const isCreate = o.kind === 'create';
        o.el = h('div', {
          id: o.id, role: 'option', class: isCreate ? 'opt opt-create' : 'opt',
          'aria-selected': String(Boolean(o.selected)), 'aria-disabled': o.disabled ? 'true' : null,
          onPointerdown: e => {
            lastPointer = e.pointerType || 'mouse';
            if (lastPointer === 'mouse' && document.activeElement === input) e.preventDefault(); // 마우스로 고를 때는 입력칸 포커스 유지
          },
          onClick: () => { const via = lastPointer || 'mouse'; lastPointer = null; activate(o, via); }
        },
          isCreate ? h('span', { class: 'opt-spacer', 'aria-hidden': 'true' })
                   : h('span', { class: 'opt-box', 'aria-hidden': 'true' }, o.selected ? icon('check') : null),
          h('span', { class: 'opt-main' }, h('span', { class: 'opt-name' }, o.label), o.meta ? h('span', { class: 'opt-meta' }, o.meta) : null),
          o.credits === undefined ? null : h('span', { class: 'opt-credits' }, COPY.common.credits(o.credits)));
        return o.el;
      }
      function renderList() {
        const { found, groups } = buildGroups();
        options = [];
        seq = 0;
        listbox.replaceChildren(...groups.filter(g => g.opts.length).map((g, gi) => {
          const els = g.opts.map(o => { options.push(o); return optionEl(o); });
          if (!g.label) return h('div', { role: 'group', 'aria-label': COPY.pick.groupResults }, els);
          const labelId = `cs-g${gi}`;
          return h('div', { role: 'group', 'aria-labelledby': labelId }, h('div', { id: labelId, class: 'group-label' }, g.label), els);
        }));
        guideEl.hidden = Boolean(query.trim());
        setActive(query.trim() ? options.findIndex(o => !o.disabled) : -1, false);
        clearTimeout(announceTimer);
        if (found !== null) announceTimer = setTimeout(() => { status.textContent = found ? COPY.pick.found(found) : COPY.pick.notFound; }, 400);
      }
      function setActive(i, scroll = true) {
        if (options[activeIndex] && options[activeIndex].el) options[activeIndex].el.classList.remove('is-active');
        activeIndex = i;
        const o = options[i];
        if (o) {
          o.el.classList.add('is-active');
          input.setAttribute('aria-activedescendant', o.id);
          if (scroll) o.el.scrollIntoView({ block: 'nearest' });
        } else {
          input.removeAttribute('aria-activedescendant');
        }
      }
      function moveActive(delta) {
        const enabled = options.map((o, i) => (o.disabled ? -1 : i)).filter(i => i >= 0);
        if (!enabled.length) return;
        const pos = enabled.indexOf(activeIndex);
        const next = pos < 0 ? (delta > 0 ? 0 : enabled.length - 1) : (pos + delta + enabled.length) % enabled.length;
        setActive(enabled[next]);
      }
      function activate(o, via) {
        if (!o || o.disabled) return;
        if (o.kind === 'course') {
          if (o.selected) {
            const c = semCourses().find(x => !x.isCustom && x.name === o.item.name);
            if (c) removeCourse(semId, c.id);
          } else {
            addOfficial(semId, o.item);
          }
        } else if (o.kind === 'existing') {
          removeCourse(semId, o.course.id);
        } else if (o.kind === 'create' && o.name) {
          addCustom(semId, o.name);
        }
        if (query) { query = ''; input.value = ''; }
        renderList();
        onChange();
        // 손가락으로 골랐으면 키보드를 내려 목록이 보이게 하고, 키보드나 마우스로 골랐으면 이어서 입력하게 둔다
        if (via === 'touch' || via === 'pen') input.blur();
        else input.focus({ preventScroll: true });
      }

      input.addEventListener('input', () => { query = input.value; renderList(); });
      input.addEventListener('keydown', e => {
        if (e.isComposing || e.keyCode === 229) return; // 한글 조합 중에 누른 키는 입력기가 처리한다
        if (e.key === 'ArrowDown') { e.preventDefault(); moveActive(1); }
        else if (e.key === 'ArrowUp') { e.preventDefault(); moveActive(-1); }
        else if (e.key === 'Enter') { e.preventDefault(); if (options[activeIndex]) activate(options[activeIndex], 'keyboard'); }
        else if (e.key === 'Escape' && query) { e.preventDefault(); query = ''; input.value = ''; renderList(); }
      });

      renderList();
      return { el: [h('div', { class: 'search' }, input), status, listbox, guideEl], input };
    }

    /* ---------- 화면: 직접 입력 과목의 학점, 구분 ---------- */
    function CreditsScreen(semId, course) {
      const route = semRoute(semId, 'custom', course.id, 'credits');
      const buttons = [1, 2, 3, 4].map(n => choice(COPY.common.credits(n), course.credits === n, () => {
        updateCourse(semId, course.id, { credits: n });
        advance(semId, route);
      }));
      return {
        title: COPY.custom.creditsTitle,
        el: Screen({ back: true, topLabel: SEM_BY_ID[semId].label, topRight: homeLink(), progress: flowProgress(semId, route),
                     body: [...Question(COPY.custom.creditsTitle, course.name), Choices('choices-4', buttons)] })
      };
    }
    function CategoryScreen(semId, course) {
      const route = semRoute(semId, 'custom', course.id, 'category');
      const buttons = ['major', 'ge'].map(cat => choice(catLabel(cat), course.category === cat, () => {
        updateCourse(semId, course.id, { category: cat });
        advance(semId, route);
      }));
      return {
        title: COPY.custom.categoryTitle,
        el: Screen({ back: true, topLabel: SEM_BY_ID[semId].label, topRight: homeLink(), progress: flowProgress(semId, route),
                     body: [...Question(COPY.custom.categoryTitle, course.name), Choices('choices-2', buttons)] })
      };
    }

    /* ---------- 화면: 성적 ---------- */
    function GradeScreen(semId, course, editMode) {
      const route = semRoute(semId, 'grade', course.id);
      const gradeSteps = getQueue(semId).filter(r => r.includes('/grade/'));
      const stepIndex = gradeSteps.indexOf(route);
      const meta = COPY.grade.meta(course.credits, catLabel(course.category));
      const help = !editMode && stepIndex >= 0 ? `${COPY.grade.step(stepIndex + 1, gradeSteps.length)}, ${meta}` : meta;
      function pick(grade) {
        const wasRetake = RETAKE_GRADES.includes(course.grade);
        updateCourse(semId, course.id, { grade });
        markAnswered(semId, course.id);
        if (RETAKE_GRADES.includes(grade) && !wasRetake) toast(COPY.grade.retakeNote);
        if (editMode) history.back();
        else advance(semId, route);
      }
      const pendingChosen = course.grade === null && (editMode || sessionAnswered(semId).has(course.id));
      const buttons = [
        ...GRADE_OPTIONS.map(g => choice(g, course.grade === g, () => pick(g))),
        choice(COPY.grade.pending, pendingChosen, () => pick(null), 'choice-wide')
      ];
      return {
        title: COPY.grade.title(course.name),
        el: Screen({ back: true, topLabel: SEM_BY_ID[semId].label, topRight: homeLink(),
                     progress: editMode ? null : flowProgress(semId, route),
                     body: [...Question(COPY.grade.title(course.name), help), Choices('choices-4', buttons)] })
      };
    }

    /* ---------- 화면: 학기 요약 ---------- */
    function ReviewScreen(semId) {
      const sem = SEM_BY_ID[semId];
      const list = state.semesters[semId];
      const summary = summarize(state).bySemester[semId];
      const gpa = fmtGpa(summary.gpa);
      const next = SEMESTERS[sem.order + 1];
      const rows = list.map(c => {
        const retake = RETAKE_GRADES.includes(c.grade);
        const metaParts = [COPY.common.credits(c.credits), catLabel(c.category)];
        if (c.isCustom) metaParts.push(COPY.common.custom);
        return h('li', { class: 'row' },
          h('button', { type: 'button', class: 'row-main', 'aria-label': `${COPY.review.editLabel(c.name)}, ${c.grade || COPY.review.pending}`,
                        onClick: () => go(`${semRoute(semId, 'grade', c.id)}?back=review`) },
            h('span', { class: 'row-text' },
              h('span', { class: 'row-title' }, c.name),
              h('span', { class: 'row-meta' }, metaParts.join(', ')),
              retake ? h('span', { class: 'status-retake' }, COPY.review.retake) : null),
            h('span', { class: c.grade ? 'row-value' : 'row-value is-pending' }, c.grade || COPY.review.pending)),
          h('button', { type: 'button', class: 'row-del', 'aria-label': COPY.review.deleteLabel(c.name),
                        onClick: () => { removeCourse(semId, c.id); render(); } }, COPY.review.delete));
      });
      const help = list.length
        ? (gpa === null ? COPY.review.metaNoGpa(summary.credits) : COPY.review.meta(summary.credits, gpa))
        : COPY.review.emptyHelp;
      const primary = next
        ? h('button', { type: 'button', class: 'btn btn-primary',
                        onClick: () => (state.semesters[next.id].length ? go(semRoute(next.id, 'review')) : startSemester(next.id)) },
            state.semesters[next.id].length ? COPY.review.nextView(next.label) : COPY.review.nextInput(next.label))
        : h('button', { type: 'button', class: 'btn btn-primary', onClick: () => go('/home') }, COPY.common.home);
      return {
        title: sem.label,
        el: Screen({
          back: true, topLabel: sem.label, topRight: homeLink(),
          body: [
            ...Question(list.length ? COPY.review.titleDone(sem.label) : COPY.review.titleEmpty(sem.label), help),
            list.length ? h('ul', { class: 'group', style: { marginTop: '32px' } }, rows) : null
          ],
          footer: [
            h('div', { class: 'footer-row' },
              h('button', { type: 'button', class: 'btn btn-text', onClick: () => startSemester(semId) }, COPY.review.addMore),
              next ? h('button', { type: 'button', class: 'btn btn-text', onClick: () => go('/home') }, COPY.common.home) : null),
            primary
          ]
        })
      };
    }

    /* ---------- 화면: 홈 ---------- */
    function Bar(value, max, cls = '') {
      const pct = max > 0 ? Math.min(100, Math.round((value / max) * 100)) : 0;
      return h('div', { class: 'bar', 'aria-hidden': 'true' }, h('div', { class: `bar-fill ${cls}`.trim(), style: { width: `${pct}%` } }));
    }
    function HomeScreen() {
      const s = summarize(state);
      const g = s.graduation;
      const remain = Math.max(0, g.total - s.earned.total);
      const retakeCredits = s.retakes.reduce((n, r) => n + r.credits, 0);
      const firstEmpty = firstEmptySemester();

      const hero = h('section', { class: 'hero' },
        h('p', { class: 'hero-label' }, remain > 0 ? COPY.home.remainLabel : COPY.home.doneLabel),
        h('h1', { class: 'hero-title', tabindex: '-1' },
          h('span', { class: 'hero-num num' }, remain > 0 ? remain : g.total),
          remain > 0 ? COPY.home.remainUnit : COPY.home.doneUnit),
        Bar(s.earned.total, g.total, remain > 0 ? '' : 'is-done'),
        h('div', { class: 'bar-caption' }, h('span', { class: 'num' }, COPY.home.progress(s.earned.total, g.total))),
        s.inProgress.total > 0 ? h('p', { class: 'note' }, COPY.home.inProgress(s.inProgress.total)) : null);

      const stat = (label, value) => h('div', { class: 'stat' },
        h('p', { class: 'stat-label' }, label),
        value === null ? h('p', { class: 'stat-value is-empty' }, COPY.home.gpaNone)
                       : h('p', { class: 'stat-value' }, fmtGpa(value), h('small', null, COPY.home.gpaScale)));

      const domain = (name, value, max) => h('li', { class: 'domain' },
        h('div', { class: 'domain-head' },
          h('span', { class: 'domain-name' }, name),
          h('span', { class: 'domain-value' }, COPY.home.progress(value, max),
            value >= max ? h('span', { class: 'domain-done' }, COPY.home.domainDone) : null)),
        Bar(value, max, value >= max ? 'is-done' : 'is-neutral'));

      const retakeSection = h('section', { class: 'section' },
        h('h2', { class: 'section-title' }, COPY.home.retakeTitle,
          s.retakes.length ? h('span', { class: 'num' }, COPY.home.retakeSummary(s.retakes.length, retakeCredits)) : null),
        s.retakes.length
          ? h('ul', { class: 'group' }, s.retakes.map(r => h('li', { class: 'row' },
              h('button', { type: 'button', class: 'row-main', onClick: () => go(semRoute(r.semId, 'review')) },
                h('span', { class: 'row-text' },
                  h('span', { class: 'row-title' }, r.name),
                  h('span', { class: 'row-meta' }, `${SEM_BY_ID[r.semId].label}, ${COPY.common.credits(r.credits)}`)),
                h('span', { class: 'status-retake' }, r.grade)))))
          : h('div', { class: 'group' }, h('p', { class: 'quiet' }, COPY.home.retakeEmpty)));

      const semRows = SEMESTERS.map(sem => {
        const b = s.bySemester[sem.id];
        return h('li', { class: 'row' },
          h('button', { type: 'button', class: 'row-main', onClick: () => (b.count ? go(semRoute(sem.id, 'review')) : startSemester(sem.id)) },
            h('span', { class: 'row-text' }, h('span', { class: 'row-title' }, sem.label)),
            h('span', { class: 'row-side' }, b.count ? COPY.home.semMeta(b.credits, fmtGpa(b.gpa)) : COPY.home.semEmpty)));
      });

      return {
        title: null,
        el: Screen({
          homeBar: true,
          topRight: h('button', { type: 'button', class: 'link-btn', onClick: () => go('/settings') }, COPY.home.settings),
          body: [
            storageOK ? null : h('p', { class: 'banner', role: 'alert' }, COPY.home.saveFailed),
            tipSlot(),
            hero,
            h('div', { class: 'stats' }, stat(COPY.home.gpaTotal, s.gpa.total), stat(COPY.home.gpaMajor, s.gpa.major)),
            h('ul', { class: 'group', style: { marginTop: '8px' } },
              domain(COPY.common.major, s.earned.major, g.major),
              domain(COPY.common.ge, s.earned.ge, g.ge)),
            YEAR_CONFIG[state.studentYear].majorNote ? h('p', { class: 'note' }, YEAR_CONFIG[state.studentYear].majorNote) : null,
            retakeSection,
            h('section', { class: 'section' },
              h('h2', { class: 'section-title' }, COPY.home.semesters),
              h('ul', { class: 'group' }, semRows)),
            h('p', { class: 'basis' }, COPY.home.basis(YEAR_CONFIG[state.studentYear].label))
          ],
          footer: firstEmpty
            ? [h('button', { type: 'button', class: 'btn btn-primary', onClick: () => startSemester(firstEmpty) }, COPY.home.cta(SEM_BY_ID[firstEmpty].label))]
            : null
        })
      };
    }

    /* ---------- 화면: 설정 ---------- */
    function SettingsScreen() {
      const n = countCourses();
      const message = h('p', { class: 'field-error', role: 'alert', style: { marginTop: '8px' } });
      const fileInput = h('input', { type: 'file', accept: '.json,application/json', hidden: true,
        onChange: async e => {
          const file = e.target.files && e.target.files[0];
          e.target.value = '';
          if (file) await importBackup(file, message);
        } });
      return {
        title: COPY.settings.title,
        el: Screen({
          back: true, topLabel: COPY.settings.title,
          body: [
            h('h1', { class: 'q-title', tabindex: '-1' }, COPY.settings.title),
            h('section', { class: 'section', style: { marginTop: '32px' } },
              h('h2', { class: 'section-title' }, COPY.settings.yearSection),
              h('ul', { class: 'group' }, h('li', { class: 'row' },
                h('button', { type: 'button', class: 'row-main', onClick: () => go('/settings/year') },
                  h('span', { class: 'row-text' }, h('span', { class: 'row-title' }, YEAR_CONFIG[state.studentYear].label)),
                  h('span', { class: 'row-side' }, COPY.settings.change))))),
            h('section', { class: 'section' },
              h('h2', { class: 'section-title' }, COPY.settings.backupSection),
              h('p', { class: 'setting-help' }, IS_IOS && IS_STANDALONE ? COPY.settings.backupHelpApp : COPY.settings.backupHelp),
              h('div', { class: 'setting-actions' },
                h('button', { type: 'button', class: 'btn btn-secondary', onClick: e => exportBackup(e.currentTarget, message) }, COPY.settings.export),
                h('button', { type: 'button', class: 'btn btn-secondary', onClick: () => fileInput.click() }, COPY.settings.import),
                fileInput),
              message),
            h('section', { class: 'section' },
              h('h2', { class: 'section-title' }, COPY.settings.resetSection),
              h('p', { class: 'setting-help' }, n ? COPY.settings.resetHelp : COPY.settings.resetEmpty),
              n ? h('button', { type: 'button', class: 'btn btn-danger-outline', onClick: async () => {
                const ok = await confirmDialog({ title: COPY.settings.resetConfirmTitle(n), body: COPY.settings.resetConfirmBody, confirm: COPY.settings.reset, danger: true });
                if (!ok) return;
                resetAll();
                SEMESTERS.forEach(s => resetFlow(s.id));
                render();
                toast(COPY.settings.resetDone);
              } }, COPY.settings.reset) : null)
          ]
        })
      };
    }
    /* 백업 받기. 실행 환경에 따라 세 갈래로 나뉜다.
       1) claude.ai 아티팩트 뷰어: 페이지가 직접 시작하는 다운로드가 막혀 있어서 downloads 기능으로 저장을 요청한다(저장 확인 창이 뜬다).
       2) 아이폰 홈 화면 앱: 파일 내려받기가 제대로 되지 않는 경우가 있어 공유 시트로 넘긴다('파일에 저장'을 고를 수 있다).
       3) 그 밖(브라우저, 내려받은 파일): 기존 방식으로 내려받는다. 2)가 실패해도 여기로 내려온다. */
    let downloadsPromise = null;
    function getDownloads() {
      if (!HAS_HOST) return Promise.resolve(null);
      if (!downloadsPromise) downloadsPromise = window.claude.use('downloads').catch(() => null);
      return downloadsPromise;
    }
    async function exportBackup(button, messageEl) {
      const d = new Date();
      const ymd = `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}`;
      const filename = `knu_curriculum_backup_v4_${ymd}.json`;
      const text = JSON.stringify({ ...state, exportedAt: d.toISOString() }, null, 2);
      if (messageEl) messageEl.textContent = '';
      if (HAS_HOST) {
        if (button) button.disabled = true;
        try {
          const downloads = await getDownloads();
          if (!downloads) { if (messageEl) messageEl.textContent = COPY.settings.exportUnavailable; return; }
          const result = await downloads.save({ filename, data: text });
          if (result && result.status === 'saved') toast(COPY.settings.exported);
        } catch (err) {
          const code = err && err.code;
          if (code === 'declined') return; // 보는 사람이 저장을 취소했다
          console.warn('백업 저장 실패:', code, err);
          const unavailable = ['unavailable', 'not_granted', 'capability_disabled', 'capability_removed', 'rejected_extension', 'extension_not_enabled'];
          if (messageEl) messageEl.textContent = unavailable.includes(code) ? COPY.settings.exportUnavailable : COPY.settings.exportFailed;
        } finally {
          if (button) button.disabled = false;
        }
        return;
      }
      // 공유 시트는 누른 직후에만 열 수 있으므로(사용자 활성화) 이 앞에서는 await를 쓰지 않는다
      if (IS_IOS && IS_STANDALONE && typeof navigator.share === 'function' && typeof navigator.canShare === 'function') {
        let file = null;
        try { file = new File([text], filename, { type: 'application/json' }); } catch (err) { file = null; }
        if (file && navigator.canShare({ files: [file] })) {
          try {
            await navigator.share({ files: [file] });
            toast(COPY.settings.shared);
            return;
          } catch (err) {
            if (err && err.name === 'AbortError') return; // 공유 시트를 그냥 닫았다
            console.warn('공유 실패, 내려받기로 대신함:', err);
          }
        }
      }
      const blob = new Blob([text], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = h('a', { href: url, download: filename });
      document.body.append(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      toast(COPY.settings.exported);
    }
    async function importBackup(file, messageEl) {
      messageEl.textContent = '';
      let raw;
      try {
        raw = JSON.parse(await file.text());
      } catch (err) {
        console.warn('백업 파일 읽기 실패:', err);
        messageEl.textContent = COPY.settings.importUnreadable;
        return;
      }
      const result = migrate(raw);
      if (!result.ok) {
        console.warn('백업 형식 오류:', result.error);
        messageEl.textContent = result.error === 'mixed-year' ? COPY.settings.importMixed : COPY.settings.importNotBackup;
        return;
      }
      const current = countCourses();
      if (current > 0) {
        const ok = await confirmDialog({ title: COPY.settings.importConfirmTitle, body: COPY.settings.importConfirmBody(current), confirm: COPY.settings.importAction });
        if (!ok) return;
      }
      replaceState(result.state);
      SEMESTERS.forEach(s => resetFlow(s.id));
      render();
      toast(COPY.settings.imported(YEAR_CONFIG[state.studentYear].label, countCourses()));
    }

    /* ---------- 시작 ---------- */
    (function init() {
      const loaded = loadState();
      if (loaded.state) state = loaded.state;
      if (loaded.storageError) storageOK = false;
      if (loaded.source === 'legacy') save(); // 이전 버전 기록은 지우지 않고 V4 키에 새로 쓴다
      if (loaded.notice) startupNotice = COPY.home[loaded.notice];
      getDownloads(); // 아티팩트 뷰어 안이면 저장 기능을 미리 준비해 둔다(없으면 아무 일도 하지 않는다)
      if (IS_WEB && !HAS_HOST && (IS_IOS || IS_STANDALONE)) requestPersistence();
      window.addEventListener('hashchange', render);

      const first = parseHash().parts[0];
      // 기록이 있는 사람이 학번 질문 주소로 페이지를 새로 열면 홈에서 시작한다(앱 안에서 뒤로 가 학번을 다시 고르는 경우는 그대로 둔다)
      if (first === 'start' && state.studentYear) location.replace('#/home');
      // 주소로 바로 들어와 앱 안의 이전 기록이 없으면, 뒤로 가기가 앱 밖으로 나가지 않도록 홈을 한 칸 아래에 깔아 둔다.
      // 페이지를 읽는 중에 location.hash를 바꾸면 브라우저가 새 기록이 아니라 교체로 처리하므로 History API를 쓴다.
      if (first && first !== 'home' && first !== 'start' && !session.get('visited') && state.studentYear) {
        const target = location.hash;
        try {
          history.replaceState(null, '', '#/home');
          history.pushState(null, '', target);
        } catch (err) {
          console.warn('이전 기록 깔기 생략:', err);
        }
      }
      session.set('visited', true);
      render();
      if (loaded.source === 'legacy') toast(COPY.home.legacyImported(YEAR_CONFIG[state.studentYear].label, countCourses()));
    })();
  </script>
</body>
</html>
