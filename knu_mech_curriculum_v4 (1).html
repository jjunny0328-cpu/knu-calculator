<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FAFAFA">
  <!-- 홈 화면에 추가했을 때의 이름과 화면 모양(아이폰은 apple- 접두사, 나머지는 표준 이름을 읽는다).
       아이콘과 manifest 파일 연결은 웹 주소로 열었을 때만 app-script의 '실행 환경' 구역에서 붙인다. -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="학점 계산기">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="format-detection" content="telephone=no">
  <title>기계설계공학전공 학점 계산기</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <style>
    /* ==========================================================================
       디자인 결정 기록 (StyleSeed lock)
       규칙 조합: product-ui × consumer-service × education
                 × onboarding(흐름) / dashboard(홈) × calm-consumer × 기존 파란색 키 컬러
       - 키 컬러 #1D4ED8: 주 버튼, 현재 선택, 진행 표시에만 쓴다
       - 간격: 8px 격자(4px 보조), 좌우 여백 24px
       - 모서리: 12px 한 가지(안쪽에 들어가는 작은 요소만 6px)
       - 높이: 버튼과 입력 48px, 선택지 56px
       - 구분: 여백, 톤, 1px 선 순서. 테두리와 그림자를 함께 쓰지 않는다(토스트, 대화상자만 그림자)
       - 글자: Pretendard Variable. 24, 20, 17, 16, 14, 13px. 숫자는 tabular-nums
       - 움직임: 200ms 한 가지. prefers-reduced-motion이면 움직이지 않는다
       - 아이콘: 뒤로, 체크 두 개만(2px 선). 이모지는 쓰지 않는다
       ========================================================================== */
    :root {
      --bg: #FAFAFA;
      --surface: #FFFFFF;
      --surface-muted: #F1F3F5;
      --text-strong: #2A2A2A;
      --text: #3C3C3C;
      --text-2: #5C636E;
      --text-3: #69707A;
      --text-disabled: #A3A9B1;
      --line: #E4E7EB;
      --line-strong: #C3C9D0;
      --key: #1D4ED8;
      --key-hover: #1E40AF;
      --key-tint: #EEF3FF;
      --on-key: #FFFFFF;
      --bar-track: #E4E7EB;
      --bar-neutral: #56657A;
      --success: #15803D;
      --danger: #B91C1C;
      --toast-bg: #2A2A2A;
      --toast-action: #A9C1FF;

      --radius: 12px;
      --radius-inner: 6px;
      --control-h: 48px;
      --option-h: 56px;
      --gutter: 24px;
      --maxw: 480px;
      --topbar-h: 56px;
      --dur: 200ms;
      --ease: cubic-bezier(0.2, 0.8, 0.2, 1);
      --font: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, system-ui, Roboto,
              "Helvetica Neue", "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; }
    /* 밝은 화면 한 가지로 디자인했다(의도한 단일 테마). 노치가 있는 휴대폰에서는 위아래 안전 영역만큼 띄운다. */
    :root {
      color-scheme: light;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
      background: var(--bg);
    }
    html { -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      font-size: 16px;
      line-height: 1.5;
      word-break: keep-all;
      overflow-wrap: anywhere;
    }
    button, input { font: inherit; color: inherit; }
    button { cursor: pointer; }
    [hidden] { display: none !important; }
    [tabindex="-1"]:focus { outline: none; }
    :focus-visible { outline: 2px solid var(--key); outline-offset: 2px; }
    .sr-only {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
    }
    .num { font-variant-numeric: tabular-nums; white-space: nowrap; }
    .icon { width: 24px; height: 24px; display: block; }
    /* 눌림 상태는 모든 누를 수 있는 요소에 같은 방식 하나로 준다 */
    .btn:active, .choice:active, .row-main:active, .row-del:active, .link-btn:active,
    .icon-btn:active, .toast-action:active, .opt:not([aria-disabled="true"]):active { filter: brightness(0.94); }

    /* ---------- 화면 뼈대 ---------- */
    #app { max-width: var(--maxw); margin: 0 auto; }
    .screen {
      min-height: calc(100vh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
      min-height: calc(100dvh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
      display: flex; flex-direction: column;
    }
    .topbar {
      position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
      height: var(--topbar-h);
      box-shadow: 0 calc(-1 * env(safe-area-inset-top, 0px)) 0 var(--bg); /* 스크롤할 때 상태 표시줄 아래 틈을 가린다 */
      display: flex; align-items: center; gap: 4px;
      padding: 0 8px;
      background: var(--bg);
    }
    .topbar-label { flex: 1; min-width: 0; font-size: 16px; font-weight: 600; color: var(--text-2);
                    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .topbar-label.is-root { padding-left: 16px; }
    .topbar-title { flex: 1; padding-left: 16px; font-size: 17px; font-weight: 700; color: var(--text-strong); }
    .topbar-spacer { width: 44px; flex: none; }
    .step-progress { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: var(--bar-track); }
    .step-progress-fill { height: 100%; background: var(--key); transition: width var(--dur) var(--ease); }
    .icon-btn {
      width: 44px; height: 44px; flex: none;
      display: grid; place-items: center;
      border: 0; border-radius: var(--radius); background: none; color: var(--text-strong);
    }
    .link-btn {
      min-height: 44px; padding: 0 12px; flex: none;
      border: 0; border-radius: var(--radius); background: none;
      font-size: 15px; font-weight: 600; color: var(--text-2);
    }
    .content { flex: 1; padding: 8px var(--gutter) 40px; }
    .footer {
      position: sticky; bottom: 0; z-index: 10;
      padding: 12px var(--gutter) calc(16px + env(safe-area-inset-bottom));
      background: var(--bg);
      display: flex; flex-direction: column; gap: 8px;
    }
    .footer-note { margin: 0; text-align: center; font-size: 14px; color: var(--text-2); }
    .footer-row { display: flex; gap: 8px; justify-content: center; }

    @media (prefers-reduced-motion: no-preference) {
      .content { animation: enter var(--dur) var(--ease); }
      @keyframes enter { from { opacity: 0; transform: translateY(8px); } }
    }

    /* ---------- 질문 ---------- */
    .q-title {
      margin: 16px 0 0;
      font-size: 24px; line-height: 1.35; font-weight: 700; letter-spacing: -0.01em;
      color: var(--text-strong);
    }
    .q-help { margin: 8px 0 0; font-size: 16px; color: var(--text-2); }

    /* ---------- 버튼 ---------- */
    .btn {
      width: 100%; height: var(--control-h);
      border: 0; border-radius: var(--radius);
      font-size: 16px; font-weight: 600;
      transition: background-color var(--dur) var(--ease);
    }
    .btn-primary { background: var(--key); color: var(--on-key); }
    .btn-secondary { background: var(--surface-muted); color: var(--text-strong); }
    .btn-danger { background: var(--danger); color: #FFFFFF; }
    .btn-text { width: auto; height: 44px; padding: 0 12px; background: none; color: var(--text-2); font-weight: 500; }
    .btn-danger-outline { background: var(--surface); color: var(--danger); box-shadow: inset 0 0 0 1px var(--line); }
    @media (hover: hover) {
      .btn-primary:hover { background: var(--key-hover); }
      .btn-secondary:hover, .btn-text:hover, .link-btn:hover, .icon-btn:hover { background: var(--surface-muted); }
    }

    /* ---------- 선택지(학번, 학점, 구분, 성적) ---------- */
    .choices { display: grid; gap: 8px; margin-top: 32px; }
    .choices-col { grid-template-columns: 1fr; }
    .choices-2 { grid-template-columns: repeat(2, 1fr); }
    .choices-4 { grid-template-columns: repeat(4, 1fr); }
    .choice {
      min-height: var(--option-h);
      padding: 0 16px;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      border: 1px solid var(--line); border-radius: var(--radius);
      background: var(--surface); color: var(--text-strong);
      font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums;
      transition: border-color var(--dur) var(--ease), background-color var(--dur) var(--ease);
    }
    .choice-row { justify-content: space-between; font-size: 17px; text-align: left; }
    .choice-wide { grid-column: 1 / -1; font-size: 16px; font-weight: 500; color: var(--text-2); }
    .choice-meta { font-size: 14px; font-weight: 500; color: var(--key); }
    .choice[aria-current="true"] { border-color: var(--key); background: var(--key-tint); color: var(--key); }
    @media (hover: hover) { .choice:not([aria-current="true"]):hover { border-color: var(--line-strong); } }

    /* ---------- 추천 입력 컴포넌트(콤보박스) ---------- */
    .search {
      position: sticky; top: calc(var(--topbar-h) + env(safe-area-inset-top, 0px)); z-index: 15;
      margin: 0 calc(-1 * var(--gutter));
      padding: 24px var(--gutter) 8px;
      background: var(--bg);
    }
    .search-input {
      width: 100%; height: var(--control-h);
      padding: 0 16px;
      border: 1px solid var(--line-strong); border-radius: var(--radius);
      background: var(--surface);
      font-size: 16px; /* 16px 미만이면 iOS가 입력 시 화면을 확대한다 */
    }
    .search-input::placeholder { color: var(--text-3); }
    .search-input:focus { outline: 2px solid var(--key); outline-offset: -1px; border-color: transparent; }
    .listbox { margin-top: 4px; }
    .group-label { padding: 16px 12px 4px; font-size: 13px; font-weight: 600; color: var(--text-2); }
    .opt {
      display: flex; align-items: center; gap: 12px;
      min-height: var(--option-h);
      padding: 8px 12px;
      border-radius: var(--radius);
      cursor: pointer;
      scroll-margin-top: calc(var(--topbar-h) + 88px);
      scroll-margin-bottom: 120px;
    }
    .opt.is-active { background: var(--surface-muted); outline: 2px solid var(--key); outline-offset: -2px; }
    @media (hover: hover) { .opt:not([aria-disabled="true"]):hover { background: var(--surface-muted); } }
    .opt-box {
      width: 22px; height: 22px; flex: none;
      display: grid; place-items: center;
      border: 2px solid var(--line-strong); border-radius: var(--radius-inner);
      color: #FFFFFF;
    }
    .opt-box .icon { width: 16px; height: 16px; }
    .opt[aria-selected="true"] .opt-box { background: var(--key); border-color: var(--key); }
    .opt-spacer { width: 22px; flex: none; }
    .opt-main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
    .opt-name { font-size: 16px; color: var(--text-strong); }
    .opt[aria-selected="true"] .opt-name { font-weight: 600; }
    .opt-meta { font-size: 13px; color: var(--text-3); }
    .opt-credits { flex: none; font-size: 14px; color: var(--text-2); font-variant-numeric: tabular-nums; }
    .opt[aria-disabled="true"] { cursor: default; }
    .opt[aria-disabled="true"] .opt-name,
    .opt[aria-disabled="true"] .opt-credits { color: var(--text-disabled); }
    .opt[aria-disabled="true"] .opt-box { border-color: var(--line); background: var(--surface-muted); }
    .opt-create .opt-name { color: var(--key); font-weight: 600; }
    .list-guide { margin: 16px 12px 0; font-size: 14px; color: var(--text-2); }
    .field-error { margin: 0; font-size: 14px; color: var(--danger); }

    /* ---------- 목록 묶음(학기 요약, 홈, 설정) ---------- */
    .group {
      margin: 0; padding: 0; list-style: none;
      background: var(--surface); border-radius: var(--radius);
    }
    .group > li + li { border-top: 1px solid var(--line); }
    .row { display: flex; align-items: center; }
    .row-main {
      flex: 1; min-width: 0; min-height: 64px;
      display: flex; align-items: center; gap: 12px;
      padding: 12px 16px;
      border: 0; border-radius: var(--radius); background: none; text-align: left;
    }
    .row-text { flex: 1; min-width: 0; display: flex; flex-direction: column; }
    .row-title { font-size: 16px; font-weight: 600; color: var(--text-strong); }
    .row-meta { font-size: 13px; color: var(--text-3); }
    .row-value { flex: none; font-size: 16px; font-weight: 700; color: var(--text-strong); font-variant-numeric: tabular-nums; }
    .row-value.is-pending { font-weight: 500; font-size: 14px; color: var(--text-3); }
    .row-side { flex: none; font-size: 14px; color: var(--text-2); font-variant-numeric: tabular-nums; text-align: right; }
    .row-del {
      flex: none; height: 44px; padding: 0 16px;
      border: 0; border-radius: var(--radius); background: none;
      font-size: 14px; color: var(--text-3);
    }
    @media (hover: hover) { .row-main:hover, .row-del:hover { background: var(--surface-muted); } }
    .status-retake {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 13px; font-weight: 600; color: var(--danger);
    }
    .status-retake::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

    /* ---------- 홈 ---------- */
    .hero { padding: 16px 0 8px; }
    .hero-label { margin: 0; font-size: 16px; color: var(--text-2); }
    .hero-title { margin: 0; font-size: 20px; font-weight: 700; color: var(--text-strong); letter-spacing: -0.01em; }
    .hero-num { font-size: 40px; line-height: 1.15; letter-spacing: -0.02em; margin-right: 2px; }
    .bar { height: 8px; border-radius: 4px; background: var(--bar-track); overflow: hidden; }
    .bar-fill { height: 100%; border-radius: 4px; background: var(--key); transition: width var(--dur) var(--ease); }
    .bar-fill.is-neutral { background: var(--bar-neutral); }
    .bar-fill.is-done { background: var(--success); }
    .bar-caption { display: flex; justify-content: space-between; margin-top: 8px; font-size: 14px; color: var(--text-2); }
    .hero .bar { margin-top: 16px; }
    .note { margin: 12px 0 0; font-size: 14px; color: var(--text-2); }
    .section { margin-top: 40px; }
    .section-title { margin: 0 0 12px; font-size: 17px; font-weight: 700; color: var(--text-strong); }
    .section-title .num { font-weight: 500; color: var(--text-2); margin-left: 4px; font-size: 15px; }
    .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 32px; }
    .stat { padding: 16px; background: var(--surface); border-radius: var(--radius); }
    .stat-label { margin: 0; font-size: 14px; color: var(--text-2); }
    .stat-value { margin: 4px 0 0; font-size: 26px; font-weight: 700; color: var(--text-strong); font-variant-numeric: tabular-nums; }
    .stat-value small { font-size: 14px; font-weight: 500; color: var(--text-3); margin-left: 4px; }
    .stat-value.is-empty { font-size: 16px; font-weight: 500; color: var(--text-3); padding: 6px 0; }
    .domain { padding: 16px; }
    .domain-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
    .domain-name { font-weight: 600; color: var(--text-strong); }
    .domain-value { font-size: 14px; color: var(--text-2); font-variant-numeric: tabular-nums; }
    .domain-done { color: var(--success); font-weight: 600; margin-left: 8px; }
    .quiet { margin: 0; padding: 16px; font-size: 15px; color: var(--text-2); }
    .banner { margin: 8px 0 0; padding: 12px 16px; border-radius: var(--radius); background: #FFF7E6; color: #7A4B00; font-size: 14px; }
    .basis { margin: 24px 0 0; font-size: 13px; color: var(--text-3); text-align: center; }
    /* 안내 카드(아이폰 홈 화면 추가, 앱 안 브라우저). 톤으로만 구분하고 한 번 닫으면 다시 나오지 않는다 */
    .tip { margin: 16px 0 0; padding: 16px 16px 8px; border-radius: var(--radius); background: var(--key-tint); }
    .tip-title { margin: 0; font-size: 16px; line-height: 1.4; font-weight: 700; color: var(--text-strong); }
    .tip-body { margin: 4px 0 0; font-size: 14px; color: var(--text-2); }
    .tip-steps { margin: 8px 0 0; padding-left: 20px; font-size: 14px; color: var(--text); }
    .tip-steps li + li { margin-top: 4px; }
    .tip-warn { margin: 8px 0 0; font-size: 14px; font-weight: 600; color: #7A4B00; }
    .tip-actions { display: flex; justify-content: flex-end; margin: 4px -8px 0 0; }
    .tip .btn-text { color: var(--key); font-weight: 600; }

    /* ---------- 설정 ---------- */
    .setting-actions { display: grid; gap: 8px; margin-top: 12px; }
    .setting-help { margin: 0 0 12px; font-size: 14px; color: var(--text-2); }

    /* ---------- 토스트, 대화상자 ---------- */
    .toast-region {
      position: fixed; left: 0; right: 0; z-index: 50;
      bottom: calc(104px + env(safe-area-inset-bottom));
      display: flex; justify-content: center;
      padding: 0 var(--gutter);
      pointer-events: none;
    }
    .toast {
      width: 100%; max-width: calc(var(--maxw) - 2 * var(--gutter));
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: 8px 8px 8px 16px; min-height: 52px;
      border-radius: var(--radius);
      background: var(--toast-bg); color: #FFFFFF;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12);
      font-size: 15px;
      pointer-events: auto;
    }
    @media (prefers-reduced-motion: no-preference) {
      .toast { animation: toast-in var(--dur) var(--ease); }
      @keyframes toast-in { from { opacity: 0; transform: translateY(8px); } }
    }
    .toast-action {
      flex: none; min-height: 44px; padding: 0 12px;
      border: 0; border-radius: var(--radius-inner); background: none;
      color: var(--toast-action); font-weight: 700;
    }
    dialog {
      width: min(calc(100% - 48px), 400px);
      padding: 24px;
      border: 0; border-radius: var(--radius);
      background: var(--surface); color: var(--text);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.16);
    }
    dialog::backdrop { background: rgba(0, 0, 0, 0.4); }
    .dialog-title { margin: 0; font-size: 20px; line-height: 1.35; font-weight: 700; color: var(--text-strong); }
    .dialog-body { margin: 8px 0 0; color: var(--text-2); }
    .dialog-message { margin: 0; font-size: 17px; line-height: 1.6; font-weight: 600; color: var(--text-strong); }
    .dialog-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 24px; }

    @media (min-width: 768px) {
      .content { padding-top: 24px; }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="toast-region" class="toast-region" role="status" aria-live="polite" aria-atomic="true"></div>
  <dialog id="dialog" aria-labelledby="dialog-title" aria-describedby="dialog-body"></dialog>
  <noscript><p style="padding: 24px;">이 계산기는 자바스크립트가 켜져 있어야 동작해요.</p></noscript>

  <!-- ======================================================================
       1. data + domain: 교육과정 데이터와 순수 함수(DOM 접근 없음)
       Node나 브라우저 콘솔에서 이 블록만 따로 실행해 테스트할 수 있다.
       ====================================================================== -->
  <script id="domain">
    'use strict';
    /* 변경 기록
       v4 (2026-10): 1) 학번별 졸업 요건 분리(2020: 교양 36, 전공 94 / 2021~2024: 교양 19, 전공 111 / 2025: 교양 36, 전공 94)
                     2) 학번을 바꾸면 입력한 과목을 모두 삭제하고 새로 시작(학번 간 데이터 유지 중단)
                     3) 스키마 4, 저장 키 knu_mech_curriculum_user_data_v4. 이전 기록은 형식이 맞을 때만 가져오고 아니면 빈 상태로 시작

        { name: '재료강도실험', credits: 3, type: '전공선택', sem: '4-1' },
        { name: '연소 및 에너지공학', credits: 3, type: '전공선택', sem: '4-1' },
        { name: '제어시스템 응용 [교직]', credits: 3, type: '전공선택', sem: '4-1' },

        { name: '컴퓨터비전과 기계 (AI)', credits: 3, type: '전공선택', sem: '4-2' }
      ]
    };

    /* 과목의 다른 이름. 글자가 겹치지 않아 유사도로는 찾을 수 없는 이름을 데이터로 보충한다.
       키는 교육과정의 과목명과 정확히 같아야 한다. */
    const COURSE_ALIASES = {
      'CAD실습': ['캐드실습'],
      '응용CAD실습': ['응용캐드실습'],
      'CAM': ['캠'],
      'CNC 가공': ['씨엔씨가공'],
      'CNC가공및실습': ['씨엔씨가공및실습'],
      'C프로그래밍': ['씨프로그래밍'],
      'Communication in English(L&R)Ⅰ': ['영어회화1', '영어듣기읽기1'],
      'Communication in English(S&W)Ⅱ': ['영어회화2', '영어말하기쓰기2'],
      'Communication in English(L&R)Ⅰ,Ⅱ': ['영어회화', '영어듣기읽기'],
      'Communication in English(S&W)Ⅰ,Ⅱ': ['영어회화', '영어말하기쓰기'],
      'K-VALUE UP 미래설계Ⅰ': ['케이밸류업미래설계1'],
      'K-VALUE UP 미래설계II': ['케이밸류업미래설계2']
    };

    /* 학번별 설정. 졸업 기준과 F 합산 규칙을 학번 단위 데이터로 분리했다(학칙 확인 후 값만 바꾸면 된다).
       V4: 졸업 요건을 학번별로 따로 둔다. 화면은 교양과 전공 두 칸으로만 나누므로,
       교육과정표의 일반선택(2020), 융합선택(2021~2024), 융합탐색(2025) 학점을 전공 목표에 합쳐 두었다.
       교육과정표 원래 값: 2020 교양 36, 전공 81, 일반선택 13 / 2021~2024 교양 19, 전공 108, 융합선택 3 /
       2025 교양 36, 전공 81, 융합탐색 13(모두 총 130). majorNote는 홈 화면 전공 막대 아래에 보여 주는 안내다. */
    const YEAR_CONFIG = {
      '2020': {
        label: '2020학번',
        graduation: { total: 130, major: 94, ge: 36 },
        majorNote: '전공 94학점에는 일반선택 13학점이 포함돼 있어요.',
        countFailedCredits: true,
        majorTypes: ['전공기초', '전공필수', '전공선택']
      },
      '2021_2024': {
        label: '2021~2024학번',
        graduation: { total: 130, major: 111, ge: 19 },
        majorNote: '전공 111학점에는 융합선택 3학점이 포함돼 있어요.',
        countFailedCredits: true,
        majorTypes: ['수학', '기초과학', '전산학', '전공필수', '콜라주', '전공핵심', '전공선택']
      },
      '2025': {
        label: '2025학번',
        graduation: { total: 130, major: 94, ge: 36 },
        majorNote: '전공 94학점에는 융합탐색 13학점이 포함돼 있어요.',
        countFailedCredits: true,
        majorTypes: ['전공필수', '콜라주', '전공선택']
      }
    };
    const YEAR_IDS = ['2020', '2021_2024', '2025'];

    const SEMESTERS = [
      { id: '1-1', label: '1학년 1학기' }, { id: '1-2', label: '1학년 2학기' },
      { id: '2-1', label: '2학년 1학기' }, { id: '2-2', label: '2학년 2학기' },
      { id: '3-1', label: '3학년 1학기' }, { id: '3-2', label: '3학년 2학기' },
      { id: '4-1', label: '4학년 1학기' }, { id: '4-2', label: '4학년 2학기' }
    ];
    const SEM_BY_ID = Object.fromEntries(SEMESTERS.map((s, i) => [s.id, { ...s, order: i }]));

    const GRADE_POINTS = { 'A+': 4.5, 'A0': 4.0, 'B+': 3.5, 'B0': 3.0, 'C+': 2.5, 'C0': 2.0, 'D+': 1.5, 'D0': 1.0, 'F': 0.0 };
    const GRADE_OPTIONS = ['A+', 'A0', 'B+', 'B0', 'C+', 'C0', 'D+', 'D0', 'F', 'P'];
    const RETAKE_GRADES = ['C+', 'C0', 'D+', 'D0', 'F'];

    /* ---------- 저장 형식과 키 ----------
       V4부터 학번 간 데이터 유지를 하지 않는다. 학번을 바꾸면 입력한 과목을 모두 지우고 새로 시작한다.
       저장 키는 앱 버전마다 따로 써서 이전 앱의 기록과 충돌하지 않게 한다.
       이전 키는 처음 열 때 한 번 읽어 보기만 하고, 지우거나 덮어쓰지 않는다.
         v1, v2 앱: 'knu_mech_curriculum_user_data_v1' (schemaVersion 없음, 1로 취급)
         v3 앱:     'knu_mech_curriculum_user_data_v2' (schemaVersion 2)
         v4 앱:     'knu_mech_curriculum_user_data_v4' (schemaVersion 4) */
    const SCHEMA_VERSION = 4;
    const STORAGE_KEY_V4 = 'knu_mech_curriculum_user_data_v4';
    const LEGACY_STORAGE_KEYS = ['knu_mech_curriculum_user_data_v2', 'knu_mech_curriculum_user_data_v1'];
    const ACCEPTED_SCHEMAS = [1, 2, 4];
    const MAX_COURSES_PER_SEMESTER = 40;

    function emptySemesters() {
      return Object.fromEntries(SEMESTERS.map(s => [s.id, []]));
    }
    function newState() {
      return { schemaVersion: SCHEMA_VERSION, studentYear: null, semesters: emptySemesters() };
    }
    function newId() {
      return 'c_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 8);
    }
    function categoryOfType(type, year) {
      return YEAR_CONFIG[year].majorTypes.includes(type) ? 'major' : 'ge';
    }
    function findCurriculumCourse(year, name) {
      return CURRICULUM_DATA[year].find(c => c.name === name) || null;
    }

    /* ---------- 마이그레이션과 검증 ----------
       localStorage의 이전 기록, 이전 버전 백업 JSON, V4 백업 JSON을 모두 이 함수 하나로 읽는다.
       예외를 밖으로 던지지 않고 { ok: true, state } 또는 { ok: false, error } 하나만 돌려준다.
       구조가 하나라도 맞지 않으면 일부만 살리지 않고 통째로 거절한다. 거절되면 호출하는 쪽은 빈 상태로 시작한다.
       V4 규칙: 정규 과목의 전공/교양 분류는 저장된 값을 믿지 않고 그 학번 교육과정에서 다시 정한다.
       그 학번 교육과정에 없는 정규 과목이 있으면 다른 학번 기록이 섞인 것이므로 거절한다(mixed-year). */
    function migrate(raw) {
      try {
        return migrateUnsafe(raw);
      } catch (err) {
        return { ok: false, error: 'exception', detail: String((err && err.message) || err) };
      }
    }

    function migrateUnsafe(raw) {
      const fail = error => ({ ok: false, error });
      if (!raw || typeof raw !== 'object' || Array.isArray(raw)) return fail('not-object');
      const version = raw.schemaVersion === undefined ? 1 : raw.schemaVersion;
      if (!ACCEPTED_SCHEMAS.includes(version)) return fail('unknown-version');
      const year = raw.studentYear;
      if (typeof year !== 'string' || !Object.prototype.hasOwnProperty.call(YEAR_CONFIG, year)) return fail('bad-year');
      const rawSems = raw.semesters;
      if (!rawSems || typeof rawSems !== 'object' || Array.isArray(rawSems)) return fail('bad-semesters');

      const semesters = emptySemesters();
      const usedIds = new Set();
      for (const sem of SEMESTERS) {
        if (!Object.prototype.hasOwnProperty.call(rawSems, sem.id)) continue;
        const list = rawSems[sem.id];
        if (list === undefined || list === null) continue;
        if (!Array.isArray(list)) return fail('bad-semesters');
        if (list.length > MAX_COURSES_PER_SEMESTER) return fail('too-many');
        for (const rawCourse of list) {
          const r = normalizeCourse(rawCourse, year, version);
          if (!r.ok) return fail(r.error);
          if (usedIds.has(r.course.id)) r.course.id = newId();
          usedIds.add(r.course.id);
          semesters[sem.id].push(r.course);
        }
      }
      return { ok: true, from: version, state: { schemaVersion: SCHEMA_VERSION, studentYear: year, semesters } };
    }

    function normalizeCourse(c, year, version) {
      const bad = error => ({ ok: false, error });
      if (!c || typeof c !== 'object' || Array.isArray(c)) return bad('bad-course');
      const name = typeof c.name === 'string' ? c.name.trim().slice(0, 60) : '';
      if (!name) return bad('bad-course');
      let grade = null;
      if (c.grade !== null && c.grade !== undefined) {
        if (typeof c.grade !== 'string' || !GRADE_OPTIONS.includes(c.grade)) return bad('bad-course');
        grade = c.grade;
      }
      // 불러온 id는 형식을 검사한다. 형식이 다르면 새로 만든다(파일 속 문자열이 코드로 해석될 여지를 없앤다)
      const id = typeof c.id === 'string' && /^c_[A-Za-z0-9_]{1,48}$/.test(c.id) ? c.id : newId();
      if (c.isCustom !== true) {
        // 정규 과목: 이름, 학점, 분류를 모두 그 학번 교육과정에서 다시 가져온다
        const entry = findCurriculumCourse(year, name);
        if (!entry) return bad('mixed-year');
        return { ok: true, course: { id, name: entry.name, credits: entry.credits, category: categoryOfType(entry.type, year), sourceType: entry.type, grade, isCustom: false } };
      }
      const credits = Number(c.credits);
      if (!Number.isInteger(credits) || credits < 0 || credits > 30) return bad('bad-course');
      let category;
      if (version === 1) category = c.customCategory === '전공' ? 'major' : 'ge'; // v1, v2 앱은 '전공'/'교양' 문자열로 저장했다
      else if (c.category === 'major' || c.category === 'ge') category = c.category;
      else return bad('bad-course');
      return { ok: true, course: { id, name, credits, category, sourceType: null, grade, isCustom: true } };
    }

    /* ---------- 집계(파생 값: 저장하지 않고 매번 계산) ---------- */
    function summarize(state) {
      const cfg = YEAR_CONFIG[state.studentYear] || YEAR_CONFIG['2021_2024'];
      const out = {
        graduation: cfg.graduation,
        earned: { total: 0, major: 0, ge: 0 },
        inProgress: { total: 0, major: 0, ge: 0 },
        gpa: { total: null, major: null },
        retakes: [],
        bySemester: {},
        courseCount: 0
      };
      let wSum = 0, cSum = 0, mwSum = 0, mcSum = 0;
      for (const sem of SEMESTERS) {
        const list = state.semesters[sem.id] || [];
        let semCredits = 0, sw = 0, sc = 0;
        for (const c of list) {
          const cr = Number(c.credits) || 0;
          const bucket = c.category === 'major' ? 'major' : 'ge';
          semCredits += cr;
          out.courseCount += 1;
          if (c.grade === null) { // 아직 안 나온 성적: 평점과 재수강 판정에서 빠지고 수강 중으로 센다
            out.inProgress.total += cr;
            out.inProgress[bucket] += cr;
            continue;
          }
          if (c.grade !== 'F' || cfg.countFailedCredits) {
            out.earned.total += cr;
            out.earned[bucket] += cr;
          }
          if (RETAKE_GRADES.includes(c.grade)) {
            out.retakes.push({ semId: sem.id, id: c.id, name: c.name, credits: cr, grade: c.grade });
          }
          if (Object.prototype.hasOwnProperty.call(GRADE_POINTS, c.grade)) { // P는 평점 계산에서 제외
            const p = GRADE_POINTS[c.grade];
            wSum += cr * p; cSum += cr; sw += cr * p; sc += cr;
            if (bucket === 'major') { mwSum += cr * p; mcSum += cr; }
          }
        }
        out.bySemester[sem.id] = { credits: semCredits, count: list.length, gpa: sc > 0 ? sw / sc : null };
      }
      out.gpa.total = cSum > 0 ? wSum / cSum : null;
      out.gpa.major = mcSum > 0 ? mwSum / mcSum : null;
      return out;
    }

    /* ---------- 과목 검색(유사도) ----------
       순서: 정규화 → 단계별 매칭 → 순위 보정
       단계: 일치 100, 앞부분 90, 조합 중 85/75, 포함 80, 초성 70, 괄호 태그 65, 줄임말 51~60, 오타 50 이하 */
    const CHO = 'ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ';
    const JUNG = 'ㅏㅐㅑㅒㅓㅔㅕㅖㅗㅘㅙㅚㅛㅜㅝㅞㅟㅠㅡㅢㅣ';
    const JONG = ['', 'ㄱ', 'ㄲ', 'ㄳ', 'ㄴ', 'ㄵ', 'ㄶ', 'ㄷ', 'ㄹ', 'ㄺ', 'ㄻ', 'ㄼ', 'ㄽ', 'ㄾ', 'ㄿ', 'ㅀ',
                  'ㅁ', 'ㅂ', 'ㅄ', 'ㅅ', 'ㅆ', 'ㅇ', 'ㅈ', 'ㅊ', 'ㅋ', 'ㅌ', 'ㅍ', 'ㅎ'];
    const JONG_SPLIT = { 'ㄳ': ['ㄱ', 'ㅅ'], 'ㄵ': ['ㄴ', 'ㅈ'], 'ㄶ': ['ㄴ', 'ㅎ'], 'ㄺ': ['ㄹ', 'ㄱ'], 'ㄻ': ['ㄹ', 'ㅁ'],
                         'ㄼ': ['ㄹ', 'ㅂ'], 'ㄽ': ['ㄹ', 'ㅅ'], 'ㄾ': ['ㄹ', 'ㅌ'], 'ㄿ': ['ㄹ', 'ㅍ'], 'ㅀ': ['ㄹ', 'ㅎ'], 'ㅄ': ['ㅂ', 'ㅅ'] };
    const S_BASE = 0xAC00, S_COUNT = 11172, N_COUNT = 588, T_COUNT = 28; // Unicode 표준 3.12절
    const ROMAN = { i: '1', ii: '2', iii: '3' };
    const BRACKETS = /〔([^〕]*)〕|\[([^\]]*)\]|〈([^〉]*)〉|<([^>]*)>|\((ai)\)/gi;

    const isSyllable = ch => { const k = ch.charCodeAt(0) - S_BASE; return k >= 0 && k < S_COUNT; };
    const choOf = ch => isSyllable(ch) ? CHO[Math.floor((ch.charCodeAt(0) - S_BASE) / N_COUNT)] : ch;
    const toCho = s => Array.from(s, choOf).join('');
    function toJamo(s) {
      let out = '';
      for (const ch of s) {
        if (!isSyllable(ch)) { out += ch; continue; }
        const k = ch.charCodeAt(0) - S_BASE;
        out += CHO[Math.floor(k / N_COUNT)] + JUNG[Math.floor((k % N_COUNT) / T_COUNT)] + JONG[k % T_COUNT];
      }
      return out;
    }

    /* 비교용 키 만들기. NFKC를 통째로 쓰면 키보드로 친 호환 자모(ㄷ, U+3137)가
       조합용 자모(U+1103)로 바뀌어 초성 검색이 깨진다. 그래서 NFC 뒤 로마 숫자만 개별 변환한다. */
    function normalizeKey(s) {
      return String(s)
        .normalize('NFC')
        .replace(/[Ⅰ-ⅿ]/g, ch => ch.normalize('NFKC'))
        .toLowerCase()
        .replace(BRACKETS, '')
        .replace(/([가-힣),])\s*(iii|ii|i)(?=$|[^a-z])/g, (m, before, r) => before + ROMAN[r])
        .replace(/[^0-9a-z가-힣ㄱ-ㅎ]/g, '');
    }
    function bracketTags(name) {
      const tags = [];
      String(name).replace(BRACKETS, (...m) => { const t = normalizeKey(m.slice(1, 6).find(Boolean) || ''); if (t) tags.push(t); return ''; });
      return tags;
    }

    function buildIndex(items) {
      return items.map(item => {
        const keys = [normalizeKey(item.name), ...(COURSE_ALIASES[item.name] || []).map(normalizeKey)].filter(Boolean);
        return { item, key: keys[0], keys, choKeys: keys.map(toCho), jamoKeys: keys.map(toJamo), tags: bracketTags(item.name) };
      });
    }

    /* 입력기가 조합 중일 때의 문자열 처리.
       두벌식에서 "대학"을 치는 도중에는 "대ㅎ"이 아니라 "댛"(ㅎ이 받침으로 붙은 상태)이 입력칸에 들어온다.
       마지막 글자의 받침을 떼어 "다음 글자의 초성"으로 보는 해석을 하나 더 만든다. */
    function composingVariant(q) {
      const last = q[q.length - 1];
      if (!last) return null;
      if (/[ㄱ-ㅎ]/.test(last) && q.length > 1 && isSyllable(q[q.length - 2])) {
        return { head: q.slice(0, -1), tail: last };
      }
      if (!isSyllable(last)) return null;
      const k = last.charCodeAt(0) - S_BASE;
      const t = k % T_COUNT;
      if (t === 0) return null;
      const jong = JONG[t];
      const [keep, tail] = JONG_SPLIT[jong] || ['', jong];
      const bare = S_BASE + (k - t) + (keep ? JONG.indexOf(keep) : 0);
      return { head: q.slice(0, -1) + String.fromCharCode(bare), tail };
    }

    function isSubsequence(q, t) {
      let i = 0;
      for (const ch of t) { if (ch === q[i]) i += 1; if (i === q.length) return true; }
      return i === q.length;
    }

    function strongScore(q, key, choKey, variant) {
      let s = 0;
      if (key === q) s = 100;
      else if (key.startsWith(q)) s = 90;
      else if (key.includes(q)) s = 80;
      else if (/^[ㄱ-ㅎ0-9]+$/.test(q) && /[ㄱ-ㅎ]/.test(q) && choKey.includes(q)) s = choKey.startsWith(q) ? 72 : 70;
      else if (q.length >= 2 && isSubsequence(q, key)) s = Math.max(51, 60 - 0.5 * (key.length - q.length));
      if (variant && s < 85) {
        let from = key.indexOf(variant.head);
        while (from !== -1) {
          const next = key[from + variant.head.length];
          if (next && choOf(next) === variant.tail) { s = Math.max(s, from === 0 ? 85 : 75); break; }
          from = key.indexOf(variant.head, from + 1);
        }
      }
      return s;
    }

    /* 부분 문자열 편집 거리(Sellers 방식): 첫 행을 0으로 두면 본문 어디서 시작하는 일치든 한 번의 DP로 찾는다.
       창을 잘라 매번 편집 거리를 구하던 시제품보다 약 55배 빨랐다(과목 약 60개, PC 기준). */
    function substringDistance(p, t) {
      let prev = new Uint16Array(t.length + 1);
      let cur = new Uint16Array(t.length + 1);
      for (let i = 1; i <= p.length; i += 1) {
        cur[0] = i;
        for (let j = 1; j <= t.length; j += 1) {
          cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (p[i - 1] === t[j - 1] ? 0 : 1));
        }
        [prev, cur] = [cur, prev];
      }
      let best = Infinity;
      for (const v of prev) best = Math.min(best, v);
      return best;
    }

    function match(query, index, opts = {}) {
      const q = normalizeKey(query);
      if (!q) return [];
      const variant = composingVariant(q);
      let results = [];
      for (const entry of index) {
        let best = 0;
        entry.keys.forEach((k, i) => { best = Math.max(best, strongScore(q, k, entry.choKeys[i], variant)); });
        if (best < 65 && q.length >= 2 && entry.tags.some(t => t.includes(q))) best = 65;
        if (best > 0) results.push({ entry, score: best });
      }
      // 오타 단계는 앞 단계 결과가 하나도 없을 때만 쓴다. 섞으면 "열역학"에 "동역학"이 끼어든다.
      if (results.length === 0) {
        const qj = toJamo(q);
        if (qj.length >= 4) {
          for (const entry of index) {
            const d = Math.min(...entry.jamoKeys.map(jk => substringDistance(qj, jk)));
            const ratio = d / qj.length;
            if (ratio <= 0.25) results.push({ entry, score: 50 - ratio * 40 });
          }
        }
      }
      for (const r of results) if (opts.sem && r.entry.item.sem === opts.sem) r.score += 5;
      results.sort((a, b) => b.score - a.score || a.entry.key.length - b.entry.key.length);
      return results.map(r => ({ item: r.entry.item, score: r.score }));
    }

      const indexes = {};
      const rows = cases.map(([year, q, top, contains]) => {

        const got = match(q, idx, { sem: '1-1' }).map(r => r.item.name);
        const pass = contains ? got.includes(contains) : (top === null ? got.length === 0 : got[0] === top);
        return { year, query: q, expected: contains ? `포함: ${contains}` : (top === null ? '(결과 없음)' : top), got: got[0] || '(결과 없음)', pass };

      const v1 = migrate({ studentYear: '2021_2024', semesters: { '1-1': [

      rows.push({ year: 'migrate', query: 'v1 수학 과목 분류', expected: 'major', got: v1.ok && v1.state.semesters['1-1'][0].category, pass: v1.ok && v1.state.semesters['1-1'][0].category === 'major' });
      rows.push({ year: 'migrate', query: '형식이 다른 id 교체', expected: 'c_로 시작하는 새 id', got: v1.ok && v1.state.semesters['1-1'][0].id, pass: v1.ok && /^c_[a-z0-9]+_[a-z0-9]+$/.test(v1.state.semesters['1-1'][0].id) });
      // V4: 학번별 졸업 요건
      const grad = { '2020': [130, 94, 36], '2021_2024': [130, 111, 19], '2025': [130, 94, 36] };
      for (const [y, [t, m, g]] of Object.entries(grad)) {

      }
      // V4: 다른 학번 과목이 섞인 기록은 통째로 거절(대학수학Ⅰ은 2025학번 교육과정에 없다)
      const mixed = migrate({ schemaVersion: 2, studentYear: '2025', semesters: { '1-1': [
        { id: 'c_a', name: '미적분학', credits: 3, category: 'ge', grade: 'A0', isCustom: false },
        { id: 'c_b', name: '대학수학Ⅰ', credits: 3, category: 'major', grade: 'B0', isCustom: false }] } });
      rows.push({ year: 'migrate', query: '학번이 섞인 기록 거절', expected: 'mixed-year', got: mixed.error, pass: !mixed.ok && mixed.error === 'mixed-year' });
      // V4: 구조가 깨진 입력은 예외 없이 거절
      const broken = [null, 'text', [], { studentYear: '2020', semesters: { '1-1': 'x' } }, { schemaVersion: 3, studentYear: '2020', semesters: {} },
        { studentYear: '2020', get semesters() { throw new Error('boom'); } }];
      const brokenOk = broken.every(b => { const r = migrate(b); return r && r.ok === false; });
      rows.push({ year: 'migrate', query: '깨진 입력 6종', expected: '모두 거절, 예외 없음', got: brokenOk ? '모두 거절' : '실패', pass: brokenOk });

      return { passed: rows.length - failed.length, failed: failed.length, rows };
